apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: social-commerce
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - api.socialcommerce.com
    secretName: api-tls
  rules:
  - host: api.socialcommerce.com
    http:
      paths:
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8001
      - path: /content
        pathType: Prefix
        backend:
          service:
            name: content-service
            port:
              number: 8002
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8003
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8004
      - path: /search
        pathType: Prefix
        backend:
          service:
            name: search-service
            port:
              number: 8005
      - path: /recommendations
        pathType: Prefix
        backend:
          service:
            name: recommendation-service
            port:
              number: 8006
      - path: /analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 8007
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8008
