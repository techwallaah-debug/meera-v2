services:
  # User Service
  - type: web
    name: user-service
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend/services/user-service/src && python main.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: PORT
        value: 8001

  # Content Service
  - type: web
    name: content-service
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend/services/content-service/src && python main.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: PORT
        value: 8002

  # Product Service
  - type: web
    name: product-service
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend/services/product-service/src && python main.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8003

  # Order Service
  - type: web
    name: order-service
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend/services/order-service/src && python main.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PORT
        value: 8004

databases:
  - name: social-commerce-db
    plan: free
    databaseName: social_commerce
    user: admin
