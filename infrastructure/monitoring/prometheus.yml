global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'user-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - social-commerce
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: user-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: '${1}:8001'

  - job_name: 'content-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - social-commerce
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: content-service
        action: keep

  - job_name: 'product-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - social-commerce
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: product-service
        action: keep

  - job_name: 'order-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - social-commerce
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: order-service
        action: keep

  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8000']
